# Rules defined here: https://github.com/actions/labeler
type/chore:
  - changed-files:
      - any-glob-to-any-file:
          - '*.md'
          - '**/*.yml'
          - 'acceptance/**/*'
          - '.github/**/*'
          - 'go.mod'
          - 'go.sum'

type/enhancement:
  - changed-files:
      - any-glob-to-any-file:
          - '*.go'
          - '**/*.go'