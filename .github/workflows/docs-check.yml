name: "Check Documentation Section"
# NOTE: This workflow is privileged, and shouldn't be used to checkout the repo or run any of the PR code
# See more in: https://securitylab.github.com/research/github-actions-preventing-pwn-requests
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  pull-requests: write

concurrency:
  group: docs-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check the Documentation section
        uses: actions/github-script@v7
        with:
          script: |
            // Settings
            const DOCS_REPO = `${context.repo.owner}/docs`;
            const SKIP_LABEL = 'type/chore';
            const MARKER = '<!-- docs-check -->';

            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.payload.pull_request.number,
            });

            // The labeler also adds type/chore to feature PRs that touch acceptance tests or go.mod,
            // so only skip PRs where it's the only type label.
            const types = pr.labels.map(l => l.name).filter(name => name.startsWith('type/'));
            const skip = types.length === 1 && types[0] === SKIP_LABEL;

            const body = (pr.body || '').replace(/\r\n/g, '\n').replace(/<!--[\s\S]*?-->/g, '');
            const section = body.split(/^##[ \t]+Documentation[ \t]*$/m)[1]?.split(/^## /m)[0];
            const yes = section && /^[ \t]*[-*][ \t]*\[[xX]\][ \t]*Yes\b(.*)$/m.exec(section);
            const no = section && /^[ \t]*[-*][ \t]*\[[xX]\][ \t]*No\b/m.test(section);
            const docsLink = /[\w.-]+\/docs#\d+|github\.com\/[\w.-]+\/docs\/(issues|pull)\/\d+/;
            const otherLink = /#\d+|https?:\/\//;

            const findProblem = () => {
              if (section === undefined) return 'Add the `## Documentation` section from the PR template.';
              if (yes && no) return 'Tick only one of **Yes** or **No**.';
              if (!yes && !no) return 'Tick **Yes** or **No**.';
              if (yes && !docsLink.test(yes[1]) && otherLink.test(yes[1]))
                return `Link the docs issue or PR as \`${DOCS_REPO}#123\`. A bare \`#123\` links to an issue in this repo.`;
              return '';
            };
            const problem = skip ? '' : findProblem();

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: pr.number,
            });
            const old = comments.find(c => c.user.type === 'Bot' && c.body.includes(MARKER));

            if (problem) {
              const text = [
                MARKER,
                `**Documentation check:** ${problem}`,
                '',
                'If you tick **Yes** and leave the number blank, a docs issue is opened for you when this PR is merged.',
              ].join('\n');
              if (old) {
                await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body: text });
              } else {
                await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body: text });
              }
              core.setFailed(problem);
            } else if (old) {
              await github.rest.issues.deleteComment({ ...context.repo, comment_id: old.id });
            }
